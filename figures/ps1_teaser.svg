<svg xmlns="http://www.w3.org/2000/svg" width="506pt" height="96.14pt" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
  <title id="title">Who gets to interrupt: reputation-calibrated deference in multi-agent AI</title>
  <desc id="desc">Three specialized agents send candidate messages to an attention coordinator. The coordinator combines importance and urgency into a current-claim score and compares a baseline with a proposed task-reliability calibration before choosing interrupt, checkpoint queue, or minute-20 digest.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315EFB"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14877D"/></marker>
  </defs>
  <rect width="1000" height="190" fill="#FFFFFF"/>

  <g font-family="DejaVu Sans,Arial,sans-serif" fill="#18324A">
    <text x="135" y="16" font-size="15" font-weight="700" text-anchor="middle">SPECIALIZED AI AGENTS</text>
    <g stroke="#315EFB" stroke-width="1.5" fill="#F5F7FB">
      <rect x="10" y="25" width="250" height="34" rx="6"/>
      <rect x="10" y="64" width="250" height="34" rx="6"/>
      <rect x="10" y="103" width="250" height="34" rx="6"/>
    </g>
    <g text-anchor="middle">
      <text x="135" y="39" font-size="13" font-weight="700">Evidence Agent</text><text x="135" y="53" font-size="11.5">facts · citations · evidence</text>
      <text x="135" y="78" font-size="13" font-weight="700">Planning Agent</text><text x="135" y="92" font-size="11.5">deadlines · submission · sequence</text>
      <text x="135" y="117" font-size="13" font-weight="700">Idea Agent</text><text x="135" y="131" font-size="11.5">angles · titles · writing suggestions</text>
    </g>

    <line x1="260" y1="81" x2="294" y2="81" stroke="#315EFB" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <rect x="300" y="8" width="400" height="131" rx="8" fill="#FFFFFF" stroke="#14877D" stroke-width="2"/>
    <text x="500" y="28" font-size="15" font-weight="700" text-anchor="middle">ATTENTION COORDINATOR · Who gets to interrupt?</text>
    <rect x="316" y="41" width="113" height="25" rx="12" fill="#EDF7F5" stroke="#14877D" stroke-width="1.2"/>
    <rect x="443" y="41" width="113" height="25" rx="12" fill="#EDF7F5" stroke="#14877D" stroke-width="1.2"/>
    <rect x="570" y="41" width="114" height="25" rx="12" fill="#FFF4EC" stroke="#D97745" stroke-width="1.2"/>
    <text x="372.5" y="58" font-size="12.5" text-anchor="middle">Importance  I</text>
    <text x="499.5" y="58" font-size="12.5" text-anchor="middle">Urgency  U</text>
    <text x="627" y="58" font-size="11" text-anchor="middle">Historical reliability  R</text>
    <text x="500" y="87" font-size="15" font-weight="700" text-anchor="middle">Current claims:  N = 0.5I + 0.5U</text>
    <rect x="316" y="98" width="168" height="27" rx="5" fill="#F5F7FB" stroke="#315EFB" stroke-width="1.4"/>
    <rect x="496" y="98" width="188" height="27" rx="5" fill="#EDF7F5" stroke="#14877D" stroke-width="1.4"/>
    <text x="400" y="116" font-size="14" font-weight="700" text-anchor="middle" fill="#315EFB">BASELINE  S = N</text>
    <text x="590" y="116" font-size="14" font-weight="700" text-anchor="middle" fill="#14877D">PROPOSED  S = N × R</text>
    <text x="590" y="135" font-size="10.5" font-style="italic" text-anchor="middle" fill="#D97745">transparent heuristic · not proven optimal</text>

    <line x1="700" y1="81" x2="734" y2="81" stroke="#14877D" stroke-width="2" marker-end="url(#arrow-teal)"/>

    <text x="865" y="16" font-size="15" font-weight="700" text-anchor="middle">COORDINATOR DECISION</text>
    <rect x="740" y="25" width="250" height="34" rx="6" fill="#D97745" stroke="#B85E32" stroke-width="1.5"/>
    <rect x="740" y="64" width="250" height="34" rx="6" fill="#EDF7F5" stroke="#14877D" stroke-width="1.5"/>
    <rect x="740" y="103" width="250" height="34" rx="6" fill="#F5F7FB" stroke="#315EFB" stroke-width="1.5"/>
    <text x="865" y="47" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">INTERRUPT NOW</text>
    <text x="865" y="86" font-size="13" font-weight="700" text-anchor="middle">QUEUE · next 5-minute checkpoint</text>
    <text x="865" y="125" font-size="14" font-weight="700" text-anchor="middle">DIGEST · minute 20</text>

    <g fill="#F5F7FB" stroke="#CBD5E1" stroke-width="1">
      <rect x="10" y="150" width="316" height="36" rx="5"/>
      <rect x="342" y="150" width="316" height="36" rx="5"/>
      <rect x="674" y="150" width="316" height="36" rx="5"/>
    </g>
    <g text-anchor="middle">
      <text x="168" y="165" font-size="11.5" font-weight="700">ECONOMICS</text><text x="168" y="180" font-size="11.5">scarce attention · cost allocation</text>
      <text x="500" y="165" font-size="11.5" font-weight="700">COMPUTER SCIENCE</text><text x="500" y="180" font-size="11.5">transparent · auditable scheduling</text>
      <text x="832" y="165" font-size="11.5" font-weight="700">BEHAVIORAL SCIENCE</text><text x="832" y="180" font-size="11.5">cognitive burden · trust loss</text>
    </g>
  </g>
</svg>
